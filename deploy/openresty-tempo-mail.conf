# TEMPO Mail WebUI static entry and asset mapping for Stalwart.
# Include this file inside the mail.darker.one server block.

location = /admin {
    return 308 /admin/;
}

location = /account {
    return 308 /account/;
}

location ^~ /admin/assets/ {
    alias /www/sites/mail.darker.one/index/stalwart-webui-static-v1/assets/;
    access_log off;
    expires 1h;
}

location ^~ /account/assets/ {
    alias /www/sites/mail.darker.one/index/stalwart-webui-static-v1/assets/;
    access_log off;
    expires 1h;
}

# BrowserRouter routes such as /admin/directory/domains and /account/login
# must all return their own entry document. The two entry files carry
# different <base> values, so chunks never cross between the two surfaces.
location ^~ /admin/ {
    root /www/sites/mail.darker.one/index;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-store";
}

location ^~ /account/ {
    root /www/sites/mail.darker.one/index;
    index index.html;
    try_files $uri $uri/ /account/index.html;
    add_header Cache-Control "no-store";
}

location = /admin/favicon.ico {
    alias /www/sites/mail.darker.one/index/stalwart-webui-static-v1/favicon.ico;
    access_log off;
}

location = /account/favicon.ico {
    alias /www/sites/mail.darker.one/index/stalwart-webui-static-v1/favicon.ico;
    access_log off;
}

location = /admin/icons.svg {
    alias /www/sites/mail.darker.one/index/stalwart-webui-static-v1/icons.svg;
    access_log off;
}

location = /account/icons.svg {
    alias /www/sites/mail.darker.one/index/stalwart-webui-static-v1/icons.svg;
    access_log off;
}
